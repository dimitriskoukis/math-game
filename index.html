<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Μαθηματικά">
<title>🦉 Μαθηματική Περιπέτεια</title>
<style>
:root{--primary:#6c5ce7;--green:#00b894;--red:#e74c3c;--yellow:#fdcb6e;--ink:#2d3436;--muted:#636e72}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;touch-action:manipulation;overscroll-behavior:none}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#a8e6ff 0%,#d6f5ff 40%,#ffeaa7 100%);color:var(--ink);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;font-variant-numeric:tabular-nums}
button{font-family:inherit;border:none;cursor:pointer;touch-action:manipulation;color:inherit}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
#top{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(255,255,255,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 10px #0001;flex-shrink:0}
#ttl{font-size:22px;font-weight:800}
.sp{flex:1}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:20px;box-shadow:0 3px 0 #0002;white-space:nowrap}
.pill.bump{animation:pop .4s}
.iconbtn{font-size:26px;background:#fff;border-radius:14px;width:50px;height:46px;box-shadow:0 3px 0 #0002}
.iconbtn:active{transform:translateY(3px);box-shadow:none}
#screen{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.btn{font-size:22px;font-weight:800;padding:14px 22px;border-radius:18px;background:var(--primary);color:#fff;box-shadow:0 5px 0 #0003;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0003}
.btn.ghost{background:#fff;color:var(--ink)}

/* HOME */
.home{max-width:1040px;margin:0 auto;padding:24px 20px 40px;text-align:center}
.title{font-size:clamp(34px,6vw,60px);font-weight:900;margin:10px 0 4px;text-shadow:0 4px 0 #fff}
.hello{font-size:24px;font-weight:700;margin:6px 0 10px}
.namebox{background:#fff;border-radius:28px;padding:30px;max-width:520px;margin:30px auto;box-shadow:0 8px 0 #0001;font-size:22px}
.namebox .owlbig{font-size:90px;animation:bob 2s infinite ease-in-out}
.nameinp{font-size:28px;padding:14px 18px;border-radius:16px;border:4px solid #dfe6e9;width:100%;margin:14px 0;text-align:center;outline:none}
.nameinp:focus{border-color:var(--primary)}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:18px}
.world{border-radius:28px;padding:24px;color:#fff;text-align:left;box-shadow:0 8px 0 #0003;font-size:19px;font-weight:700;transition:transform .1s}
.world:active{transform:translateY(5px);box-shadow:0 3px 0 #0003}
.world .ic{font-size:60px;display:block}
.world h2{margin:6px 0;font-size:30px}
.bar{height:16px;background:#ffffff55;border-radius:8px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:#fff;border-radius:8px}
h3.sec{font-size:26px;margin:34px 0 8px}
.badges{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.badge{background:#fff;border-radius:18px;padding:12px 6px;font-size:14px;overflow-wrap:anywhere;hyphens:auto;font-weight:700;width:128px;box-shadow:0 4px 0 #0001}
.badge .b{font-size:40px;display:block}
.badge.locked{opacity:.35;filter:grayscale(1)}
.linkbtn{background:none;color:var(--muted);font-size:16px;margin-top:36px;text-decoration:underline}

/* WORLD */
.wscreen{max-width:1040px;margin:0 auto;padding:20px}
.whead{display:flex;align-items:center;gap:18px;color:#fff;border-radius:28px;padding:20px 26px;box-shadow:0 6px 0 #0002}
.whead .ic{font-size:64px}
.whead h1{margin:0;font-size:34px}
.whead p{margin:4px 0 0;font-size:20px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:20px}
.tile{background:#fff;border-radius:22px;padding:22px 10px;font-size:32px;font-weight:800;box-shadow:0 6px 0 #0002;position:relative}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 #0002}
.tile.small{font-size:22px}
.tile .num{position:absolute;top:8px;left:12px;font-size:14px;color:var(--muted)}
.tile .st{font-size:24px;margin-top:8px;letter-spacing:2px}
.tile.done{background:#d4f8ec}
.tile.practice{background:linear-gradient(135deg,#fd79a8,#fdcb6e);color:#fff;font-size:26px}
.tile.practice small{display:block;font-size:16px;margin-top:6px}
.off{opacity:.2;filter:grayscale(1)}

/* EXERCISE */
.exscreen{display:grid;grid-template-columns:1fr 340px;height:100%}
.expanel{overflow:auto;padding:20px 24px 40px;-webkit-overflow-scrolling:touch}
.exhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{color:#fff;font-weight:800;font-size:18px;padding:6px 16px;border-radius:999px}
.tries{font-size:18px;font-weight:700;color:var(--muted)}
.mascot{display:flex;align-items:center;gap:12px;margin:14px 0 22px}
.owl{font-size:58px;animation:bob 2s infinite ease-in-out;flex-shrink:0}
.bubble{background:#fff;border-radius:20px;padding:12px 18px;font-size:20px;font-weight:700;position:relative;box-shadow:0 3px 0 #0001}
.bubble::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);border:10px solid transparent;border-right-color:#fff;border-left:0}
.bubble.pop{animation:pop .35s}
.exbody{display:flex;justify-content:center;padding:10px 0}
.hints{max-width:760px;margin:20px auto 0}
.hint{background:#fff8d6;border-left:8px solid var(--yellow);padding:12px 16px;border-radius:14px;margin:10px 0;font-size:20px;font-weight:600;line-height:1.45}

.slot{display:inline-flex;align-items:center;height:1.35em;padding:0 .25em;border:4px dashed #b2bec3;border-radius:14px;background:#fff;color:var(--ink);font-weight:800;letter-spacing:.08em;transition:background .15s,border-color .15s;vertical-align:middle;cursor:pointer}
.slot.active{border:4px solid var(--primary);box-shadow:0 0 0 6px #6c5ce733}
.slot.active::after{content:'';width:3px;height:.9em;background:var(--primary);animation:blink 1s infinite;margin-left:3px}
.slot.ok{border:4px solid var(--green);background:#d4f8ec;color:#00876a}
.slot.ok::before{content:'✓';font-size:.45em;margin-right:.3em}
.slot.bad{border:4px solid var(--red);background:#ffe0dc;color:#c0392b;animation:shake .45s}
.slot.empty{animation:pulse .6s}
.slot.revealed{border:4px solid #0984e3;background:#dff1ff;color:#0984e3}

.vdiv{display:grid;grid-template-columns:auto auto;font-size:clamp(44px,7vw,76px);font-weight:800;background:#fff;padding:30px 40px;border-radius:28px;box-shadow:0 6px 0 #0001}
.vdiv .dvd{padding:0 .35em .1em 0;letter-spacing:.12em;text-align:right}
.vdiv .dvs{border-left:6px solid var(--ink);border-bottom:6px solid var(--ink);padding:0 .5em .1em .35em;color:var(--primary)}
.vdiv .work{padding:1.4em .35em 0 0;display:flex;justify-content:flex-end;align-items:flex-end}
.vdiv .quo{border-left:6px solid var(--ink);padding:.25em 0 1.4em .35em}
.field{display:flex;flex-direction:column;align-items:center;gap:6px}
.field small{font-size:17px;color:var(--muted);font-weight:800}

.vmul{display:grid;grid-template-columns:auto auto;column-gap:20px;row-gap:12px;align-items:center;font-size:clamp(40px,6.5vw,70px);font-weight:800;background:#fff;padding:30px 40px;border-radius:28px;box-shadow:0 6px 0 #0001}
.vmul .n{justify-self:end;letter-spacing:.12em;padding-right:.3em}
.vmul .lbl{font-size:18px;color:var(--muted);font-weight:800;justify-self:end;background:#f1f2f6;padding:5px 12px;border-radius:10px;white-space:nowrap}
.vmul .lbl:empty{background:none}
.vmul .line{grid-column:2;height:6px;background:var(--ink);border-radius:3px}
.vmul .slot{justify-self:end;justify-content:flex-end}
.op{margin-right:.4em;color:var(--primary)}

.prob{max-width:780px;width:100%;font-size:22px;line-height:1.55}
.ptext{background:#fff;border-radius:24px;padding:20px 24px;box-shadow:0 5px 0 #0001;font-weight:600}
.ptext::after{content:'';display:block;clear:both}
.pemoji{font-size:64px;float:right;margin:0 0 6px 12px;line-height:1}
.hl{background:#ffeaa7;border-radius:6px;padding:0 4px}
.steps{margin-top:18px;background:#ffffffaa;border-radius:24px;padding:10px 20px}
.step{display:flex;align-items:center;gap:12px;margin:14px 0;flex-wrap:wrap;font-size:21px;font-weight:800}
.step .slabel{flex:1;min-width:220px}
.step .slot{font-size:36px;justify-content:center}
.unit{color:var(--muted);min-width:70px}

.side{display:flex;flex-direction:column;gap:14px;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));background:rgba(255,255,255,.45);border-left:2px solid #ffffff88}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{font-size:34px;font-weight:800;height:74px;border-radius:18px;background:#fff;box-shadow:0 5px 0 #b2bec3}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 #b2bec3;background:#f1f0ff}
.key.del{background:#ffe0dc;color:#c0392b}
.key.nxt{background:#dff1ff;color:#0984e3}
.actions{display:flex;flex-direction:column;gap:12px}
.check{background:var(--green);font-size:28px;height:78px;width:100%}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{background:var(--yellow);color:var(--ink);font-size:19px;padding:12px 8px}
.tool.reveal{background:#74b9ff;grid-column:1/-1}
.glow{animation:glow 1s infinite}

@media (max-aspect-ratio:1/1){
  .exscreen{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{display:grid;grid-template-columns:1.25fr 1fr;border-left:none;border-top:2px solid #ffffff88}
  .key{height:62px}
  .actions{justify-content:center}
}
@media (max-width:600px){ .key{height:52px;font-size:28px} .check{height:62px} .side{grid-template-columns:1fr} }

/* MODAL */
.modal{position:fixed;inset:0;background:#2d343688;display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.card{background:#fff;border-radius:32px;padding:28px 32px;max-width:560px;width:100%;text-align:center;box-shadow:0 12px 0 #0002}
.pop{animation:pop .4s}
.card .big{font-size:84px;line-height:1}
.card h2{font-size:38px;margin:8px 0}
.stars{font-size:58px;letter-spacing:6px}
.stars span{display:inline-block;animation:starIn .5s both}
.explain{font-size:21px;background:#f1f2f6;border-radius:16px;padding:12px;font-weight:600;line-height:1.5}
.world-msg{font-size:24px;font-weight:900;color:#e17055}
.newbadge{font-size:21px;font-weight:800;background:#fff3c4;border-radius:14px;padding:10px;margin:8px 0}
.mbtns{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}

/* SCRATCH */
#scratch{position:fixed;inset:0;background:#fffef5;display:none;z-index:50;flex-direction:column}
#scratch.open{display:flex}
#scratch .sbar{display:flex;gap:10px;align-items:center;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:#fff;box-shadow:0 2px 8px #0002;flex-wrap:wrap;z-index:1}
#sctitle{font-size:24px;font-weight:800;flex:1;min-width:200px}
.pen{width:50px;height:50px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px #dfe6e9;font-size:24px}
.pen.sel{box-shadow:0 0 0 4px var(--primary)}
#scwrap{flex:1;position:relative;overflow:hidden;background-image:linear-gradient(#d6e6fb 1px,transparent 1px),linear-gradient(90deg,#d6e6fb 1px,transparent 1px);background-size:36px 36px}
#scv{position:absolute;left:0;top:0;touch-action:none}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15);border-color:var(--yellow)}}
@keyframes blink{50%{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes starIn{0%{transform:scale(0) rotate(-90deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes glow{50%{box-shadow:0 0 0 6px #fdcb6e99,0 5px 0 #0003;transform:scale(1.04)}}
</style>
</head>
<body>
<header id="top">
  <button id="back" class="iconbtn" aria-label="Πίσω">⬅</button>
  <div id="ttl"></div>
  <div class="sp"></div>
  <span class="pill" id="streak" title="Σερί χωρίς λάθος"></span>
  <span class="pill" id="stars"></span>
  <button id="snd" class="iconbtn" aria-label="Ήχος"></button>
</header>
<main id="screen"></main>

<div id="scratch">
  <div class="sbar">
    <div id="sctitle">✏️ Πρόχειρο</div>
    <button class="pen sel" data-c="#2d3436" style="background:#2d3436"></button>
    <button class="pen" data-c="#0984e3" style="background:#0984e3"></button>
    <button class="pen" data-c="#e74c3c" style="background:#e74c3c"></button>
    <button class="pen" data-c="erase" style="background:#fff">🧽</button>
    <button class="btn ghost" id="scclear">🗑 Σβήσ' τα</button>
    <button class="btn" id="scclose">✖ Πίσω</button>
  </div>
  <div id="scwrap"><canvas id="scv"></canvas></div>
</div>
<canvas id="confetti"></canvas>

<script>
"use strict";
/* ---------- DATA (from the worksheets) ---------- */
const DIVS=[[578,4],[625,6],[333,4],[754,8],[406,7],[849,9],[656,5],[876,2]];
const MULS=[[46,13],[64,18],[50,27],[91,14],[52,16],[28,26],[79,15],[83,12]];
const PROBS=[
 {emoji:'👕',title:'Οι φόρμες',
  text:'Μια βιοτεχνία ρούχων ράβει φόρμες γυμναστικής. Τις συσκευάζει σε κούτες που η καθεμία χωράει 12 φόρμες. Ένα κατάστημα παράγγειλε 144 φόρμες.<br><br><b>α.</b> Πόσες κούτες θα χρειαστούν για την παραγγελία;<br><b>β.</b> Αν οι κούτες χωρούσαν 9 φόρμες η καθεμία, πόσες κούτες θα χρειάζονταν;',
  steps:[{label:'α. Κούτες των 12 φορμών:',answer:12,unit:'κούτες'},{label:'β. Κούτες των 9 φορμών:',answer:16,unit:'κούτες'}],
  hints:['Μοιράζουμε τις 144 φόρμες σε κούτες → κάνουμε <b>διαίρεση</b>.','α. 144 ÷ 12 = ; &nbsp;Σκέψου: 12 × 10 = 120 και μένουν ακόμη 24…','β. 144 ÷ 9 = ; &nbsp;Σκέψου: 9 × 10 = 90 και μένουν ακόμη 54…'],
  explain:'144 ÷ 12 = <b>12 κούτες</b> και 144 ÷ 9 = <b>16 κούτες</b>.<br>Όσο πιο μικρή η κούτα, τόσο περισσότερες χρειαζόμαστε!'},
 {emoji:'🚚',title:'Το φορτηγό',
  text:'Ένα φορτηγό μπορεί να μεταφέρει το πολύ 2.000 κιλά. Έχουν ήδη φορτωθεί 40 κιβώτια των 14 κιλών, 50 κιβώτια των 24 κιλών και 7 κιβώτια των 25 κιλών.<br><br>Πόσα κιλά μπορεί ακόμη να μεταφέρει το φορτηγό;',
  steps:[{label:'40 κιβώτια × 14 κιλά =',answer:560,unit:'κιλά'},{label:'50 κιβώτια × 24 κιλά =',answer:1200,unit:'κιλά'},{label:'7 κιβώτια × 25 κιλά =',answer:175,unit:'κιλά'},{label:'Όλο το φορτίο μαζί:',answer:1935,unit:'κιλά'},{label:'Μπορεί να πάρει ακόμη:',answer:65,unit:'κιλά'}],
  hints:['Βρες πρώτα πόσο ζυγίζει κάθε ομάδα κιβωτίων με <b>πολλαπλασιασμό</b>.','Μετά <b>πρόσθεσε</b> τα τρία βάρη για να βρεις όλο το φορτίο.','Στο τέλος <b>αφαίρεσε</b> το φορτίο από τα 2.000 κιλά.'],
  explain:'560 + 1.200 + 175 = 1.935 κιλά.<br>2.000 − 1.935 = <b>65 κιλά</b> ακόμη!'},
 {emoji:'📮',title:'Τα γραμματόσημα',
  text:'Η κυρία Ιφιγένεια έχει 450 γραμματόσημα. Θέλει να τα βάλει στο καινούριο της άλμπουμ, που κάθε σελίδα του χωράει 15 γραμματόσημα.<br><br>Πόσες σελίδες θα γεμίσει;',
  steps:[{label:'Σελίδες που θα γεμίσει:',answer:30,unit:'σελίδες'}],
  hints:['Πόσες φορές χωράει το 15 στο 450; → <b>διαίρεση</b>.','Βοήθεια: 15 × 10 = 150. Πόσα «150» χωράνε στο 450;'],
  explain:'450 ÷ 15 = <b>30 σελίδες</b>.<br>Επαλήθευση: 30 × 15 = 450 ✔'}
];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
function h(tag,props={},...kids){const e=document.createElement(tag);
 for(const[k,v]of Object.entries(props||{})){ if(v==null)continue;
  if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k==='html')e.innerHTML=v;
  else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}
 for(const k of kids.flat(3)){if(k==null||k===false||k==='')continue;e.append(k instanceof Node?k:document.createTextNode(k));}
 return e;}
const PRAISE=['Μπράβο!','Τέλεια!','Είσαι αστέρι!','Καταπληκτικά!','Σούπερ!','Εξαιρετικά!','Ιδιοφυΐα! 🧠'];
const OOPS=['Ουπς! Δες τα κόκκινα κουτάκια και ξαναδοκίμασε 💪','Σχεδόν! Έλεγξε ξανά τις πράξεις σου 🤔','Μην τα παρατάς! Τα πράσινα είναι σωστά 👍','Κάνε την πράξη στο πρόχειρο ✏️ και ξαναδοκίμασε!'];

/* ---------- storage ---------- */
const KEY='mathAdventure_v1';
const DEF={name:'',best:{},stars:0,streak:0,bestStreak:0,badges:[],sound:true,practiced:0};
let S; try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S={...DEF}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- sound ---------- */
let actx=null;
function tone(f,d,type='triangle',when=0,vol=.18){ if(!S.sound)return;
 try{ actx=actx||new(window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended')actx.resume();
  const t=actx.currentTime+when,o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);}catch(e){} }
const sfx={
 tap:()=>tone(660,.05,'sine',0,.07),
 ok:()=>[523,659,784].forEach((f,i)=>tone(f,.16,'triangle',i*.08)),
 bad:()=>{tone(220,.22,'square',0,.06);tone(165,.3,'square',.12,.06)},
 win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',i*.1)),
};

/* ---------- exercise builders ---------- */
let building=[];
function newSlot(answers,width=4,align='center'){
 const v=h('span',{class:'v'});
 const el=h('div',{class:'slot',style:'min-width:'+width+'ch;justify-content:'+(align==='right'?'flex-end':'center')},v);
 const s={el,v,answers:answers.map(String),value:'',done:false};
 el.addEventListener('click',()=>{if(ex&&!ex.solved&&!s.done){setActive(s);sfx.tap();}});
 building.push(s);return el;}

function divSteps(a,b){const s=String(a);let cur=0,first=true,out=[];
 for(let i=0;i<s.length;i++){cur=cur*10+(+s[i]);
  if(first&&cur<b&&i<s.length-1)continue;
  const q=Math.floor(cur/b),r=cur-q*b;
  out.push(first?('Ξεκινάω από το <b>'+cur+'</b>: '+cur+' ÷ '+b+' = <b>'+q+'</b> (γιατί '+q+' × '+b+' = '+q*b+'), μένει <b>'+r+'</b>.')
               :('Κατεβάζω το '+s[i]+' → <b>'+cur+'</b>: '+cur+' ÷ '+b+' = <b>'+q+'</b> ('+q+' × '+b+' = '+q*b+'), μένει <b>'+r+'</b>.'));
  first=false;cur=r;}
 return out;}

/* ---------- interaction ---------- */
function setActive(s){if(active)active.el.classList.remove('active');active=s;if(s&&!s.done)s.el.classList.add('active');}
function say(msg){bubble.textContent=msg;bubble.classList.remove('pop');void bubble.offsetWidth;bubble.classList.add('pop');}
function nextSlot(){const L=ex.slots,i=L.indexOf(active);for(let k=1;k<=L.length;k++){const s=L[(i+k)%L.length];if(!s.done){setActive(s);return;}}}
function press(k){sfx.tap();if(!ex||ex.solved)return;
 if(k==='➡'){nextSlot();return;}
 const s=active;if(!s||s.done)return;
 if(s.el.classList.contains('bad')){s.value='';s.el.classList.remove('bad');}
 if(k==='⌫')s.value=s.value.slice(0,-1);else if(s.value.length<6)s.value=(s.value==='0'?'':s.value)+k;
 s.el.classList.remove('empty');s.v.textContent=s.value;}

function check(){if(!ex||ex.solved)return;let wrong=0,empty=0,newly=0;
 for(const s of ex.slots){if(s.done)continue;
  if(s.value===''){empty++;s.el.classList.remove('empty');void s.el.offsetWidth;s.el.classList.add('empty');continue;}
  if(s.answers.includes(String(parseInt(s.value,10)))){s.done=true;newly++;s.el.classList.remove('active','bad');s.el.classList.add('ok');}
  else{wrong++;s.el.classList.remove('bad');void s.el.offsetWidth;s.el.classList.add('bad');}}
 if(ex.slots.every(s=>s.done))return win();
 if(wrong){ex.attempts++;S.streak=0;save();updateTop();sfx.bad();say(pick(OOPS));
  triesEl.textContent='Προσπάθειες: '+ex.attempts;
  if(ex.attempts>=2&&ex.hintsShown<ex.hints.length)hintBtn.classList.add('glow');
  if(ex.attempts>=3)revealBtn.style.display='';}
 else{if(newly)sfx.ok();say(newly?'Σωστά μέχρι εδώ! ✅ Συμπλήρωσε και τα υπόλοιπα κουτάκια.':'Γράψε πρώτα κάτι στα κουτάκια! ✏️');}
 const f=ex.slots.find(s=>!s.done&&s.el.classList.contains('bad'))||ex.slots.find(s=>!s.done);if(f)setActive(f);}

function showHint(){if(!ex||ex.solved)return;sfx.tap();
 if(ex.hintsShown>=ex.hints.length){say('Αυτές ήταν όλες οι βοήθειες! Δοκίμασε στο πρόχειρο ✏️');return;}
 const el=h('div',{class:'hint pop',html:'💡 '+ex.hints[ex.hintsShown]});hintBox.append(el);ex.hintsShown++;
 hintBtn.classList.remove('glow');say('Η βοήθεια κοστίζει 1 αστέρι, αλλά δεν πειράζει — έτσι μαθαίνουμε! 💡');
 el.scrollIntoView({behavior:'smooth',block:'nearest'});}

function reveal(){if(!ex||ex.solved)return;ex.revealed=true;
 for(const s of ex.slots)if(!s.done){s.done=true;s.value=s.answers[0];s.v.textContent=s.value;s.el.className='slot revealed';}
 setActive(null);say('Δες προσεκτικά τη λύση με τα μπλε 👀');setTimeout(win,1600);}

function win(){ex.solved=true;setActive(null);
 let stars=ex.revealed?0:Math.max(1,3-ex.attempts);if(ex.hintsShown>0&&stars>2)stars=2;
 if(!ex.revealed&&ex.attempts===0){S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);}
 S.stars+=stars;let worldMsg='';const W=WORLDS[view.w];
 if(view.practice)S.practiced++;
 else{const was=worldDone(view.w),k=view.w+'-'+view.i;S.best[k]=Math.max(S.best[k]||0,stars);
  if(!was&&worldDone(view.w))worldMsg='🏆 Τελείωσες όλο το φύλλο «'+W.title+'»!';}
 save();updateTop();$('#stars').classList.add('bump');setTimeout(()=>$('#stars').classList.remove('bump'),500);
 const badges=checkBadges();
 if(stars>0){sfx.win();confetti();}else sfx.ok();
 if(navigator.vibrate)navigator.vibrate(stars?[40,40,40]:30);
 const last=!view.practice&&view.i+1>=W.items.length;
 const m=h('div',{class:'modal'},h('div',{class:'card pop'},
  h('div',{class:'big'},stars===3?'🏆':stars>0?'🎉':'📘'),
  h('h2',{},stars>0?pick(PRAISE):'Τώρα ξέρεις πώς λύνεται!'),
  h('div',{class:'stars'},[1,2,3].map(n=>h('span',{class:n<=stars?'':'off',style:'animation-delay:'+(n*.2)+'s'},'⭐'))),
  stars===3&&S.streak>1?h('p',{style:'font-size:20px;font-weight:800'},'🔥 '+S.streak+' σερί χωρίς λάθος!'):null,
  h('div',{class:'explain',html:ex.explain}),
  worldMsg?h('p',{class:'world-msg'},worldMsg):null,
  badges.map(b=>h('div',{class:'newbadge pop'},b.icon+' Νέο μετάλλιο: '+b.name)),
  h('div',{class:'mbtns'},
   h('button',{class:'btn ghost',onclick:()=>{m.remove();go({name:'world',w:view.w})}},'📋 Λίστα'),
   h('button',{class:'btn ghost',onclick:()=>{m.remove();go({...view})}},stars<3?'🔁 Ξανά':'🔁 Άλλη μία'),
   h('button',{class:'btn',onclick:()=>{m.remove();
     if(view.practice||!last)go(view.practice?{...view}:{name:'ex',w:view.w,i:view.i+1});else go({name:'world',w:view.w});}},
    last?'Τέλος ✔':'Επόμενη ➡'))));
 document.body.append(m);}

/* ---------- confetti ---------- */
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=null;
function confetti(){const d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);
 const C=['#6c5ce7','#00b894','#fdcb6e','#e17055','#0984e3','#fd79a8'];
 for(let i=0;i<160;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight/3,vx:(Math.random()-.5)*18,vy:-Math.random()*18-4,s:Math.random()*9+6,c:pick(C),r:Math.random()*6,vr:(Math.random()-.5)*.4,l:0});
 if(!raf)loop();}
function loop(){cx.clearRect(0,0,innerWidth,innerHeight);
 for(const p of parts){p.vy+=.5;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();}
 parts=parts.filter(p=>p.y<innerHeight+50&&p.l<260);
 if(parts.length)raf=requestAnimationFrame(loop);else{cx.clearRect(0,0,innerWidth,innerHeight);raf=null;}}

/* ---------- scratch pad ---------- */
const sc=$('#scratch'),scv=$('#scv'),sctx=scv.getContext('2d');let pen='#2d3436',drawing=false,last=null,scReady=false;
function openScratch(){sfx.tap();sc.classList.add('open');$('#sctitle').textContent='✏️ Πρόχειρο — '+(ex?ex.title:'');
 if(!scReady){const d=window.devicePixelRatio||1,N=Math.max(screen.width,screen.height,innerWidth,innerHeight)+40;
  scv.width=N*d;scv.height=N*d;scv.style.width=N+'px';scv.style.height=N+'px';sctx.setTransform(d,0,0,d,0,0);scReady=true;}}
function clearScratch(){if(scReady)sctx.clearRect(0,0,scv.width,scv.height);}
const ptOf=e=>{const r=scv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
function stroke(a,b,e){sctx.lineCap='round';sctx.lineJoin='round';
 if(pen==='erase'){sctx.globalCompositeOperation='destination-out';sctx.lineWidth=34;}
 else{sctx.globalCompositeOperation='source-over';sctx.strokeStyle=pen;sctx.lineWidth=e.pointerType==='pen'?2+(e.pressure||.5)*4:4;}
 sctx.beginPath();sctx.moveTo(a.x,a.y);sctx.lineTo(b.x+.01,b.y);sctx.stroke();}
scv.addEventListener('pointerdown',e=>{drawing=true;last=ptOf(e);scv.setPointerCapture(e.pointerId);stroke(last,last,e);});
scv.addEventListener('pointermove',e=>{if(!drawing)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of evs){const p=ptOf(ev);stroke(last,p,e);last=p;}});
['pointerup','pointercancel','pointerleave'].forEach(t=>scv.addEventListener(t,()=>{drawing=false;}));
document.querySelectorAll('.pen').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.pen').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');pen=b.dataset.c;}));
$('#scclear').addEventListener('click',clearScratch);
$('#scclose').addEventListener('click',()=>sc.classList.remove('open'));

/* ---------- top bar & keyboard ---------- */
$('#back').addEventListener('click',()=>{sfx.tap();document.querySelectorAll('.modal').forEach(m=>m.remove());
 if(view.name==='ex')go({name:'world',w:view.w});else go({name:'home'});});
$('#snd').addEventListener('click',()=>{S.sound=!S.sound;save();updateTop();sfx.tap();});
addEventListener('keydown',e=>{if(view.name!=='ex'||document.querySelector('.modal')||sc.classList.contains('open'))return;
 if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫');else if(e.key==='Enter')check();
 else if(e.key==='Tab'||e.key==='ArrowRight'){e.preventDefault();press('➡');}});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

render();
</script>
</body>
</html>
